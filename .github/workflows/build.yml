name: Build APK

on:
  push:
    paths-ignore:
      - tools/**
      - .github/workflows/fetch-sounds.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Soundboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Soundboard-apk
          path: Soundboard.apk

  # Installs the release APK on a Pixel-sized emulator, taps every sound and checks
  # that it really plays, exercises the settings and saves screenshots.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Soundboard-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: python3 scripts/e2e.py Soundboard.apk e2e-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-results

      # Screenshots and report also go to the `e2e-results` branch so they can be
      # browsed on GitHub (and fetched with plain git) without downloading a zip.
      - name: Publish results to e2e-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d e2e-results ] || exit 0
          cd e2e-results
          [ -f logcat.txt ] && tail -n 3000 logcat.txt > logcat.tmp && mv logcat.tmp logcat.txt
          git init -q -b e2e-results
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "E2E results for ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" e2e-results

  # Builds from the default branch that pass the test are published as a GitHub
  # release so the APK can be downloaded straight from the phone's browser.
  release:
    needs: e2e
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Soundboard-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Soundboard ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Soundboard.apk
          make_latest: true
