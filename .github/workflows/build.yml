name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Soundboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Soundboard-apk
          path: Soundboard.apk

      # Builds from the default branch are published as a GitHub release so the
      # APK can be downloaded straight from the phone's browser.
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Soundboard ${{ github.run_number }}
          files: Soundboard.apk
          make_latest: true
